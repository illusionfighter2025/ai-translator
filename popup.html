<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Translator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">译</div>
        <div class="logo-text">
          <h1>AI Translator</h1>
          <p>Translate & summarize the web</p>
        </div>
      </div>
      <button id="optionsBtn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section class="actions">
      <button id="translatePageBtn" class="action-btn primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4.42-3.58 8-8 8"/><path d="M5 9c0 2.17 2.5 4 5.5 4M12 20l4-9 4 9M13.5 17h5"/></svg>
        <span id="translatePageLabel">Translate Page</span>
      </button>
      <button id="summarizeBtn" class="action-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
        <span>Summarize Page</span>
      </button>
      <button id="selectionBtn" class="action-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        <span>Translate Selection</span>
      </button>
    </section>

    <section class="quick-config">
      <div class="field-row">
        <label for="targetLang">Target language</label>
        <div class="seg">
          <button data-lang="zh" class="seg-btn active">中文</button>
          <button data-lang="en" class="seg-btn">English</button>
        </div>
      </div>
      <div class="field-row">
        <label for="autoSelection">Auto-translate selection</label>
        <label class="switch">
          <input type="checkbox" id="autoSelection" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="config">
      <div class="field">
        <label for="apiKey">API Key</label>
        <div class="input-wrap">
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false" />
          <button type="button" class="reveal" id="revealKey" title="Show">eye</button>
        </div>
      </div>
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.deepseek.com" spellcheck="false" />
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="deepseek-chat" spellcheck="false" />
      </div>

      <div class="config-actions">
        <button id="testBtn" class="btn ghost">Test</button>
        <button id="saveBtn" class="btn primary">Save</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </section>

    <footer class="footer">
      <span>Shortcuts: Alt+T page · Alt+S summary · Alt+Q selection</span>
      <button id="dashboardBtn" class="dashboard-link">管理面板 →</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
